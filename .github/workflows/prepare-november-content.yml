name: Prepare November content
on:
  push:
    branches: [editorial/november-2026-reviews]
    paths: [tools/build_november.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated build dependencies
        run: python3 -m pip install beautifulsoup4==4.14.3 html5lib==1.1 playwright==1.56.0
      - name: Build and validate requested website update
        run: |
          python3 tools/build_november.py
          node --check ui-check.js
      - name: Install browser and check layout and interaction
        run: |
          python3 -m playwright install --with-deps chromium
          python3 tools/check_november.py
      - name: Export build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: november-site-evidence
          retention-days: 1
          path: |
            index.html
            affiliate-links.json
            content/reviews-november-2026.json
            assets/logos
            tools/logos-*.json
            build-report.json
            browser-report.json
            previews
            QA.md
      - name: Commit generated website and logo assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html affiliate-links.json assets/logos README.md CHANGELOG.md QA.md
          if ! git diff --cached --quiet; then
            git commit -m 'Build ten November reviews, supplied logos and affiliate links'
            git push origin HEAD:editorial/november-2026-reviews
          fi
